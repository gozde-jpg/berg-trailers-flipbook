<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Berg Trailers | Digital Catalog</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a4673,#071a2e 75%);color:#fff;font-family:Arial,sans-serif}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 5%;background:#06172a;border-bottom:2px solid #208ad2}.header strong{font-size:21px;letter-spacing:1px}.header span{color:#5eb9ff}.download,.controls button{background:#087bc9;color:white;border:0;border-radius:7px;padding:11px 15px;text-decoration:none;cursor:pointer;font-weight:bold}.wrap{max-width:1080px;margin:24px auto;padding:0 15px}.controls{display:flex;justify-content:center;align-items:center;gap:15px;margin:14px 0}.controls button:disabled{opacity:.4;cursor:default}.book{display:flex;justify-content:center;align-items:center;min-height:65vh;perspective:1500px}.paper{background:white;box-shadow:0 16px 42px #0009;max-width:100%;transform-origin:left center;transition:transform .25s ease}.paper.turn{transform:rotateY(-14deg)}canvas{display:block;max-width:100%;height:auto;max-height:75vh}#status{color:#d5e9f9;text-align:center;font-size:14px;margin:10px}footer{text-align:center;color:#8aaac5;padding:22px;font-size:12px}@media(max-width:600px){.header strong{font-size:16px}.download{font-size:12px;padding:9px}.book{min-height:55vh}}</style></head><body><div class="header"><strong>BERG <span>TRAILERS</span></strong><a class="download" href="Berg_Trailers_Catalog.pdf" download>Download PDF ↓</a></div><main class="wrap"><div id="status">Loading catalog...</div><div class="book"><div class="paper" id="paper"><canvas id="page"></canvas></div></div><div class="controls"><button id="prev" disabled>← Previous</button><span id="counter">Page 1</span><button id="next" disabled>Next →</button></div></main><footer>BERG TRAILERS | DIGITAL PRODUCT CATALOG</footer><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>const url='Berg_Trailers_Catalog.pdf';const c=document.getElementById('page'),ctx=c.getContext('2d'),status=document.getElementById('status'),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter'),paper=document.getElementById('paper');let pdf=null,n=1,busy=false;async function render(){if(busy||!pdf)return;busy=true;prev.disabled=true;next.disabled=true;const page=await pdf.getPage(n);const vp=page.getViewport({scale:1});const scale=Math.min(2,1100/vp.width,1500/vp.height);const v=page.getViewport({scale});c.width=Math.floor(v.width);c.height=Math.floor(v.height);await page.render({canvasContext:ctx,viewport:v}).promise;counter.textContent=`Page ${n} of ${pdf.numPages}`;status.textContent='';prev.disabled=n===1;next.disabled=n===pdf.numPages;busy=false}async function move(delta){if(busy||!pdf||n+delta<1||n+delta>pdf.numPages)return;paper.classList.add('turn');n+=delta;await render();paper.classList.remove('turn')}prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});(async()=>{try{if(!window.pdfjsLib)throw Error('PDF viewer library unavailable');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';pdf=await pdfjsLib.getDocument(url).promise;await render()}catch(e){status.textContent='Catalog could not load. Make sure Berg_Trailers_Catalog.pdf is uploaded next to index.html.';console.error(e)}})();</script></body></html>
